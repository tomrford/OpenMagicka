name: CI

on:
  push:
    branches: [main, macos-arm64]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # On Windows, the FNA native libraries (as the release workflow takes them) give our FAudio
      # the SDL3 it runs on, so OwnFAudioTests checks it. Elsewhere the tests need no native
      # libraries. Tests that read the game's content run only when MAGICKA_DIR is set and are
      # skipped here.
      - name: Fetch the FNA native libraries
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh tools/fetch_fnalibs.sh 39715067086

      - name: Build tests
        run: dotnet build tests/OpenMagicka.Tests -c Release

      - name: Build server
        run: dotnet build src/OpenMagicka.Server -c Release

      - name: Test
        run: dotnet test tests/OpenMagicka.Tests -c Release --no-build --logger "console;verbosity=normal"
